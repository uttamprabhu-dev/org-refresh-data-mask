<template>
    <div class="slds-p-around_medium">

        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <div>
                <h2 class="slds-text-heading_medium">Custom Redaction</h2>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Select objects to permanently redact all records.</p>
            </div>
            <div>
                <lightning-button
                    variant="neutral"
                    label="Add Object"
                    icon-name="utility:add"
                    icon-position="left"
                    onclick={handleAddTile}
                    class="slds-m-right_x-small"
                ></lightning-button>
                <lightning-button
                    variant="destructive"
                    label="Run Redaction"
                    icon-name="utility:delete"
                    icon-position="left"
                    onclick={handleRunRedaction}
                    disabled={noTiles}
                ></lightning-button>
            </div>
        </div>

        <template if:false={hasTiles}>
            <div class="empty-state slds-text-align_center slds-p-around_xx-large">
                <div class="empty-icon-wrap slds-m-bottom_medium">
                    <lightning-icon icon-name="utility:database" size="large"></lightning-icon>
                </div>
                <h3 class="slds-text-heading_small slds-m-bottom_x-small">No Objects Configured</h3>
                <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                    Add objects to configure which records to redact during org refresh.
                </p>
                <lightning-button
                    variant="brand"
                    label="Add First Object"
                    icon-name="utility:add"
                    icon-position="left"
                    onclick={handleAddTile}
                ></lightning-button>
            </div>
        </template>

        <template if:true={hasTiles}>

            <div class="pagination-bar slds-m-bottom_medium">
                <lightning-button-icon
                    icon-name="utility:chevronleft"
                    variant="border"
                    disabled={isFirstPage}
                    onclick={handlePrevious}
                    alternative-text="Previous"
                ></lightning-button-icon>

                <div class="page-buttons">
                    <template for:each={paginationItems} for:item="item">
                        <template if:true={item.isDots}>
                            <span key={item.key} class="page-dots">…</span>
                        </template>
                        <template if:false={item.isDots}>
                            <button key={item.key} class={item.btnClass} data-page={item.value} onclick={handlePageClick}>
                                {item.label}
                            </button>
                        </template>
                    </template>
                </div>

                <lightning-button-icon
                    icon-name="utility:chevronright"
                    variant="border"
                    disabled={isLastPage}
                    onclick={handleNext}
                    alternative-text="Next"
                ></lightning-button-icon>

                <span class="page-count slds-text-body_small slds-text-color_weak">{currentPage} / {totalPages}</span>
            </div>

            <template for:each={displayedTiles} for:item="tile">
                <div key={tile.id} class="tile-card">

                    <div class="tile-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-icon icon-name="utility:database" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                            <span class="tile-header-label">
                                <template if:true={tile.object}>{tile.objectLabel}</template>
                                <template if:false={tile.object}>New Object</template>
                            </span>
                        </div>
                        <lightning-button-icon
                            icon-name="utility:delete"
                            variant="bare-inverse"
                            alternative-text="Remove"
                            title="Remove Object"
                            data-tile-id={tile.id}
                            onclick={handleDeleteTile}
                        ></lightning-button-icon>
                    </div>

                    <div class="tile-body">
                        <div class="slds-grid slds-grid_vertical slds-gutters">
                            <div class="slds-col slds-size_1-of-4 slds-m-bottom_large">
                                <div class="object-search-container">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">Salesforce Object</label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="text"
                                                class="slds-input"
                                                placeholder="Type to search objects..."
                                                value={tile.objectSearchTerm}
                                                data-tile-id={tile.id}
                                                oninput={handleObjectSearch}
                                                onblur={handleObjectSearchBlur}
                                            />
                                        </div>
                                    </div>
                                    <template if:true={tile.showObjectDropdown}>
                                        <div class="object-dropdown">
                                            <template if:true={tile.isObjectSearching}>
                                                <div class="dropdown-searching">
                                                    <lightning-spinner size="x-small" alternative-text="Searching..."></lightning-spinner>
                                                </div>
                                            </template>
                                            <template if:false={tile.isObjectSearching}>
                                                <template for:each={tile.objectSearchResults} for:item="obj">
                                                    <div
                                                        key={obj.apiName}
                                                        class="object-dropdown-item"
                                                        data-tile-id={tile.id}
                                                        data-api-name={obj.apiName}
                                                        data-label={obj.label}
                                                        onmousedown={handleObjectSelect}
                                                    >
                                                        <span class="obj-label">{obj.label}</span>
                                                        <span class="obj-api-name">{obj.apiName}</span>
                                                    </div>
                                                </template>
                                                <template if:true={tile.showNoObjectResults}>
                                                    <div class="no-results-msg">No objects found</div>
                                                </template>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-1">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <span class="slds-text-body_small slds-text-color_weak">Fields to redact</span>
                                    <lightning-button
                                        label="Select All"
                                        variant="base"
                                        onclick={handleSelectAllFields}
                                        data-tile-id={tile.id}
                                        disabled={tile.isObjectNotSelected}
                                    ></lightning-button>
                                </div>
                                <lightning-dual-listbox
                                    name="fields"
                                    label="Fields"
                                    source-label="Available"
                                    selected-label="To Redact"
                                    options={fieldOptions}
                                    value={tile.selectedFieldValues}
                                    onchange={handleFieldChange}
                                    data-tile-id={tile.id}
                                    disabled={tile.isObjectNotSelected}
                                ></lightning-dual-listbox>
                            </div>

                            <template if:true={tile.hasSelectedFields}>
                                <div class="slds-col slds-size_1-of-1">
                                    <div class="field-chars-section">
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">Character range per field</p>
                                        <table class="slds-table slds-table_bordered slds-table_cell-buffer field-chars-table">
                                            <thead>
                                                <tr>
                                                    <th scope="col" class="slds-text-title_caps slds-size_1-of-4">Label</th>
                                                    <th scope="col" class="slds-text-title_caps slds-size_1-of-4">Type</th>
                                                    <th scope="col" class="slds-text-title_caps slds-size_2-of-4">Inputs</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={tile.fields} for:item="field">
                                                    <tr key={field.value}>
                                                        <td class="slds-cell-wrap" data-label="Label">
                                                            <span class="field-char-label" title={field.displayLabel}>{field.displayLabel}</span>
                                                        </td>
                                                        <td class="slds-cell-wrap" data-label="Type">
                                                            <span class="slds-badge slds-badge_lightest field-type-badge">{field.dataType}</span>
                                                        </td>
                                                        <td data-label="Inputs">
                                                            <div class="field-char-inputs">
                                                                <div class="char-input-wrap">
                                                                    <label class="char-input-label">From character</label>
                                                                    <input
                                                                        type="number"
                                                                        class="slds-input char-input"
                                                                        min="0"
                                                                        max="99"
                                                                        placeholder="0"
                                                                        value={field.fromChar}
                                                                        data-tile-id={tile.id}
                                                                        data-field-api-name={field.value}
                                                                        data-char-type="from"
                                                                        oninput={handleCharInput}
                                                                    />
                                                                </div>
                                                                <div class="char-input-wrap">
                                                                    <label class="char-input-label">To character</label>
                                                                    <input
                                                                        type="number"
                                                                        class="slds-input char-input"
                                                                        min="0"
                                                                        max="99"
                                                                        placeholder="0"
                                                                        value={field.toChar}
                                                                        data-tile-id={tile.id}
                                                                        data-field-api-name={field.value}
                                                                        data-char-type="to"
                                                                        oninput={handleCharInput}
                                                                    />
                                                                </div>
                                                                <lightning-button-icon
                                                                    icon-name="utility:save"
                                                                    variant="brand"
                                                                    alternative-text="Save"
                                                                    title="Save field config"
                                                                    data-tile-id={tile.id}
                                                                    data-field-api-name={field.value}
                                                                    onclick={handleSaveFieldChars}
                                                                    class="char-save-btn"
                                                                ></lightning-button-icon>
                                                                <template if:true={field.isSaved}>
                                                                    <lightning-icon
                                                                        icon-name="utility:check"
                                                                        size="xx-small"
                                                                        class="char-saved-icon"
                                                                    ></lightning-icon>
                                                                </template>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>
            </template>

        </template>

    </div>
</template>
