<template>
  <lightning-card icon-name="standard:account">

    <div slot="title">Account</div>

    <lightning-tabset active-tab-value="custom">
      <lightning-tab label="Tab 1" value="standard">
        <div class="slds-p-around_medium">
          <h2 class="slds-text-heading_medium slds-m-bottom_medium">Data Masking</h2>
          
          <p class="slds-text-body_regular slds-m-bottom_medium">This will mask sensitive data in the account, opportunity and contact records.</p>

          <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
            <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
            <span class="slds-text-body_small">This action is irreversible. Confirm before proceeding.</span>
          </div>

          <div class="slds-m-top_medium">
            <lightning-button
              variant="brand"
              label="Mask data"
              icon-name="utility:shield"
              icon-position="left"
              onclick={handleMaskData}
            ></lightning-button>
          </div>
        </div>
      </lightning-tab>

      <lightning-tab label="Tab 2" value="custom">
        <div class="slds-p-around_medium">
          <h2 class="slds-text-heading_medium slds-m-bottom_medium">Configuration</h2>
          <lightning-button
              variant="brand"
              label="Mask data"
              icon-name="utility:check"
              icon-position="left"
              onclick={handleMaskCustomData}
            ></lightning-button>
          
          <div class="slds-m-bottom_large">
            <template for:each={tilesList} for:item="tile">
              <div key={tile.id} class="slds-box slds-m-bottom_medium">
                <div class="slds-grid slds-gutters">
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                      label="Object"
                      value={tile.object}
                      options={objectOptions}
                      onchange={handleObjectChange} 
                      data-tile-id={tile.id}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                      label="Fields"
                      value={tile.selectedFieldId}
                      options={fieldOptions}
                      onchange={handleFieldSelect}
                      onfocus={handleFieldFocus}
                      data-tile-id={tile.id}
                      data-object={tile.object}
                    ></lightning-combobox>
                    <div class="slds-m-top_medium selected-fields-container">
                      <template for:each={tile.fields} for:item="field">
                        <div key={field.value} class="slds-m-bottom_small">
                          <lightning-button
                            variant="neutral"
                            label={field.displayLabel}
                            title={field.displayLabel}
                            data-field-value={field.value}
                            data-tile-id={tile.id}
                            onclick={handleRemoveField}
                            icon-name="utility:close"
                            icon-position="right"
                          ></lightning-button>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="slds-m-top_medium">
            <lightning-button
              variant="brand"
              label="Add Tile"
              icon-name="utility:add"
              icon-position="left"
              onclick={handleAddTile}
            ></lightning-button>
            <lightning-button
              variant="brand"
              label="Mask data"
              icon-name="utility:check"
              icon-position="left"
              onclick={handleMaskCustomData}
            ></lightning-button>
          </div>
        </div>
      </lightning-tab>
    </lightning-tabset>

  </lightning-card>
</template>
